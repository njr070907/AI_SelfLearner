name: Bug 报告
description: 报告可复现的软件、数据或 AI 行为问题
title: "bug: "
labels: ["type:bug", "status:needs-evidence"]
body:
  - type: markdown
    attributes:
      value: 请勿粘贴 API Key、真实用户回答、数据库或含个人信息的日志。
  - type: textarea
    id: impact
    attributes:
      label: 用户影响
      description: 用户或实验因此无法完成什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用合成数据给出最短复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: 版本信息
      description: 应用、数据库、Prompt、Schema、Mastery Protocol 或模型版本。

