name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Secret scan
        run: uv run python scripts/scan_secrets.py

      - name: Blocking lint
        run: uv run ruff check .

      - name: Formatting check
        run: uv run ruff format --check .

      - name: Golden set contract and provenance check
        run: |
          uv run python scripts/validate_golden_set.py
          uv run python scripts/run_golden_eval.py --dry-run
          uv run python scripts/run_golden_eval.py --output evals/runs/ci-fake-baseline.json

      - name: Database migration smoke test
        env:
          DATABASE_URL: sqlite:///data/ci.db
        run: |
          uv run python -m ai_growth_companion.repositories.database migrate
          uv run python -m ai_growth_companion.repositories.database status

      - name: Unit, integration, and fake-loop E2E tests
        run: uv run pytest

      - name: Real Streamlit startup smoke test
        run: uv run python scripts/smoke_streamlit.py

      - name: Strict type report
        continue-on-error: true
        run: uv run mypy src app.py scripts

      - name: Coverage report
        continue-on-error: true
        run: uv run pytest --cov --cov-report=term-missing

      - name: Dependency vulnerability report
        continue-on-error: true
        run: uv run pip-audit
