[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-growth-companion"
version = "0.0.1"
description = "A Feynman-method learning diagnosis experiment with an evidence-first mastery protocol."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "streamlit>=1.41,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_growth_companion.prompts" = [
  "templates/evaluation/v0.1/*.json",
  "templates/evaluation/v0.1/*.md",
  "templates/evaluation/v0.2/*.json",
  "templates/evaluation/v0.2/*.md",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["ai_growth_companion"]

[tool.coverage.report]
show_missing = true
skip_covered = true
